# Netlify detects Next.js and adds its runtime; this pins what auto-detect got wrong.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Declared explicitly: Netlify's automatic install of the Next.js runtime was silently skipped
# (deploys had plugin_state "none" and no functions, so every page 404'd).
[[plugins]]
  package = "@netlify/plugin-nextjs"
